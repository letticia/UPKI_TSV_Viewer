<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UPKI TSV Viewer</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Light Theme (Default) */
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --surface-hover: #f1f5f9;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --glass-bg: rgba(255, 255, 255, 0.8);
            --glass-border: rgba(0, 0, 0, 0.05);
            --bg-gradient: radial-gradient(circle at top right, #e0e7ff, transparent 40%), radial-gradient(circle at bottom left, #f8fafc, transparent 40%);
            --header-text: #2563eb;
        }

        [data-theme="dark"] {
            /* Dark Theme */
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --surface-hover: #334155;
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --bg-gradient: radial-gradient(circle at top right, #1e1b4b, transparent 40%), radial-gradient(circle at bottom left, #0f172a, transparent 40%);
            --header-text: transparent;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            transition: background-color 0.3s, color 0.3s;
        }

        header {
            padding: 1.5rem 2rem;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: background-color 0.3s, border-color 0.3s;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--header-text);
            margin: 0;
        }

        [data-theme="dark"] h1 {
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        main {
            flex: 1;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 100vw;
        }

        /* Drop Zone */
        #drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 16px;
            padding: 3rem 2rem;
            text-align: center;
            background: rgba(30, 41, 59, 0.4);
            transition: padding 0.3s ease, background-color 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        #drop-zone:hover,
        #drop-zone.dragover {
            border-color: var(--primary-color);
            background: rgba(59, 130, 246, 0.1);
            transform: translateY(-2px);
        }

        #drop-zone.compact {
            padding: 1rem 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 1rem;
            border-style: solid;
        }

        #drop-zone p {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 1rem;
            transition: font-size 0.3s ease, margin 0.3s ease;
        }

        #drop-zone.compact p {
            font-size: 0.95rem;
            margin-bottom: 0;
        }

        #drop-zone.compact .badge {
            margin-top: 0;
        }

        #drop-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
            width: 100%;
            height: 100%;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            align-items: center;
            background: var(--surface-color);
            padding: 1rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .btn {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--primary-color);
            color: var(--primary-color);
        }

        .btn-outline:hover {
            background: rgba(59, 130, 246, 0.1);
        }

        .search-container {
            display: flex;
            flex: 1;
            gap: 0.5rem;
            min-width: 250px;
        }

        .search-input {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border-color 0.2s;
        }

        .search-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* Column Selector Modal */
        .col-selector-wrapper {
            position: relative;
        }

        .col-selector-popup {
            position: absolute;
            top: calc(100% + 0.5rem);
            left: 0;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            width: 280px;
            max-height: 400px;
            overflow-y: auto;
            z-index: 50;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: none;
            flex-direction: column;
            gap: 0.5rem;
        }

        .col-selector-popup.show {
            display: flex;
            animation: fadeIn 0.2s ease-out;
        }

        .col-option {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 0.9rem;
            color: var(--text-main);
            cursor: pointer;
            padding: 0.25rem 0;
        }

        .col-option input[type="checkbox"] {
            accent-color: var(--primary-color);
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        /* Table Container */
        .table-container {
            background: var(--surface-color);
            border-radius: 12px;
            border: 1px solid var(--border-color);
            overflow: auto;
            max-height: calc(100vh - 280px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 0.85rem;
        }

        th {
            background: var(--bg-color);
            color: var(--text-muted);
            font-weight: 600;
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 10;
            white-space: nowrap;
            border-bottom: 2px solid var(--border-color);
        }

        td {
            padding: 0.75rem 1rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
            vertical-align: top;
            max-width: 300px;
            word-break: break-word;
        }

        tbody tr {
            transition: background-color 0.15s;
        }

        tbody tr:hover {
            background-color: rgba(255, 255, 255, 0.03);
        }

        .hidden-col {
            display: none !important;
        }

        .hidden-row {
            display: none !important;
        }

        /* Utilities */
        .badge {
            display: inline-block;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            font-size: 0.75rem;
            font-weight: 500;
            margin-top: 1rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .empty-state {
            padding: 3rem;
            text-align: center;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Scrollbar styles */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-color);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--surface-hover);
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal-overlay.show {
            display: flex;
            animation: fadeIn 0.2s ease-out;
        }

        .modal-content {
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }

        .modal-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            font-size: 1.2rem;
            color: var(--text-main);
            margin: 0;
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1.5rem;
            line-height: 1;
        }

        .modal-close:hover {
            color: var(--text-main);
        }

        .modal-body {
            padding: 1.5rem;
            overflow-y: auto;
            flex: 1;
        }

        .modal-body pre {
            background: var(--bg-color);
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            white-space: pre-wrap;
            word-break: break-all;
            font-family: monospace;
            font-size: 0.85rem;
            color: var(--text-main);
            margin: 0;
        }

        .btn-sm {
            padding: 0.3rem 0.6rem;
            font-size: 0.8rem;
        }

        .quick-filters {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
            align-items: center;
            background: var(--surface-color);
            padding: 0.75rem 1rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            margin-bottom: 1.5rem;
        }

        .active-filter {
            background: var(--primary-color) !important;
            color: white !important;
            border-color: var(--primary-color) !important;
        }

        .search-select {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 0.6rem 1rem;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: border-color 0.2s, background-color 0.3s, color 0.3s;
            max-width: 200px;
            cursor: pointer;
        }

        .search-select:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* Status Badges */
        .status-badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.6rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
            line-height: 1;
            white-space: nowrap;
        }
        .status-success {
            background-color: rgba(34, 197, 94, 0.15);
            color: #22c55e;
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
        [data-theme="dark"] .status-success {
            background-color: rgba(34, 197, 94, 0.2);
            color: #4ade80;
        }
        .status-warning {
            background-color: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.2);
        }
        [data-theme="dark"] .status-warning {
            background-color: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
        }
        .status-danger {
            background-color: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        [data-theme="dark"] .status-danger {
            background-color: rgba(239, 68, 68, 0.2);
            color: #f87171;
        }
        .status-info {
            background-color: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.2);
        }
        [data-theme="dark"] .status-info {
            background-color: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
        }

        /* Copy Button in Table Cells */
        .copyable-cell {
            position: relative;
            padding-right: 2rem !important;
        }
        .copy-cell-btn {
            position: absolute;
            right: 0.4rem;
            top: 0.4rem;
            background: var(--surface-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 0.25rem;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s, background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
        }
        .copyable-cell:hover .copy-cell-btn {
            opacity: 1;
        }
        .copy-cell-btn:hover {
            background: var(--surface-hover);
            color: var(--text-main);
        }
        
        /* Dragover Visuals */
        #drop-zone.dragover {
            border-color: var(--primary-color);
            background: rgba(59, 130, 246, 0.15);
            transform: scale(1.01);
            box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.2);
            animation: border-dance 1.5s infinite linear;
        }
        @keyframes border-dance {
            0% { border-style: dashed; }
            50% { border-style: dotted; }
            100% { border-style: dashed; }
        }
        .drop-icon {
            color: var(--text-muted);
            margin-bottom: 0.5rem;
            transition: color 0.3s, transform 0.3s;
        }
        #drop-zone:hover .drop-icon,
        #drop-zone.dragover .drop-icon {
            color: var(--primary-color);
        }
        #drop-zone.compact .drop-icon {
            margin-bottom: 0;
            width: 24px;
            height: 24px;
        }
        
        #drop-zone .drop-zone-dragover {
            display: none;
        }
        #drop-zone.dragover .drop-zone-default {
            display: none !important;
        }
        #drop-zone.dragover .drop-zone-dragover {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
        }
        #drop-zone.compact.dragover .drop-zone-dragover {
            flex-direction: row;
            gap: 1rem;
        }
        
        .pulse {
            animation: pulse-animation 1.5s infinite ease-in-out;
        }
        @keyframes pulse-animation {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* Record Count */
        .record-count {
            font-size: 0.9rem;
            font-weight: 500;
            color: var(--text-muted);
            margin-left: auto;
            background: var(--surface-color);
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        /* Sorting Styles */
        th.sorted-col {
            color: var(--primary-color);
            background: var(--surface-hover);
        }
        
        /* Modal Copy Toast/Btn */
        #modal-copy-btn {
            transition: all 0.2s ease;
        }
        #modal-copy-btn.copied {
            background: #22c55e !important;
            color: white !important;
            border-color: #22c55e !important;
        }

        /* Paginator */
        .paginator {
            display: flex;
            gap: 0.75rem;
            align-items: center;
            justify-content: center;
            background: var(--surface-color);
            padding: 0.75rem 1.25rem;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            flex-wrap: wrap;
        }
        .paginator .page-info {
            font-size: 0.9rem;
            color: var(--text-muted);
            min-width: 120px;
            text-align: center;
        }
        .paginator .page-size-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-left: auto;
        }

        /* Loading Overlay */
        #loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            z-index: 2000;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 1rem;
        }
        #loading-overlay.show {
            display: flex;
        }
        .loading-spinner {
            width: 48px;
            height: 48px;
            border: 4px solid rgba(255,255,255,0.2);
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading-text {
            color: #f8fafc;
            font-size: 1rem;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <header>
        <h1 id="app-title">電子証明書 TSV Viewer</h1>
        <button id="theme-toggle" class="btn btn-outline btn-sm">ダークモード</button>
    </header>

    <main>
        <div id="drop-zone">
            <div class="drop-zone-default" style="display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%;">
                <svg class="drop-icon" width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                </svg>
                <p>ここにTSVファイルをドロップ、またはクリックしてファイル選択</p>
            </div>
            <div class="drop-zone-dragover">
                <svg class="drop-icon pulse" width="48" height="48" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                </svg>
                <p>ここにファイルをドロップして読み込み</p>
            </div>
            <span class="badge" id="file-info">未選択</span>
            <input type="file" id="file-input" multiple accept=".tsv">
        </div>

        <div class="controls" id="controls" style="display: none;">
            <div class="col-selector-wrapper">
                <button class="btn btn-outline" id="toggle-cols-btn">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z">
                        </path>
                    </svg>
                    表示/非表示
                </button>
                <div class="col-selector-popup" id="col-selector-popup">
                    <!-- Checkboxes will be injected here -->
                </div>
            </div>

            <div class="search-container">
                <select id="search-column-select" class="search-select">
                    <option value="all">すべての列</option>
                </select>
                <input type="text" id="search-input" class="search-input" placeholder="任意の項目を検索...">
                <button class="btn" id="search-btn">
                    <svg width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                            d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                    </svg>
                    検索
                </button>
            </div>
        </div>

        <div class="quick-filters" id="quick-filters" style="display: none;">
            <button class="btn btn-outline btn-sm" onclick="resetFilters()">リセット</button>
            <button class="btn btn-outline btn-sm" onclick="exportData()">表示結果をエクスポート</button>
            <span style="font-size: 0.85rem; color: var(--text-muted); margin-left: 0.5rem;">最終更新日:</span>
            <button class="btn btn-outline btn-sm date-filter-btn"
                onclick="setDateFilter('最終更新日', 'past', 7, this)">1週間以内</button>
            <button class="btn btn-outline btn-sm date-filter-btn"
                onclick="setDateFilter('最終更新日', 'past', 30, this)">1ヶ月以内</button>
            <button class="btn btn-outline btn-sm date-filter-btn"
                onclick="setDateFilter('最終更新日', 'past', 90, this)">3ヶ月以内</button>
            <span style="font-size: 0.85rem; color: var(--text-muted); margin-left: 0.5rem;">有効期限:</span>
            <button class="btn btn-outline btn-sm date-filter-btn"
                onclick="setDateFilter('発行・更新申請-証明書有効期限', 'future', 7, this)">1週間以内</button>
            <button class="btn btn-outline btn-sm date-filter-btn"
                onclick="setDateFilter('発行・更新申請-証明書有効期限', 'future', 30, this)">30日以内</button>
            <span id="record-count" class="record-count" style="display: none;">表示中: - 件 / 全 - 件</span>
        </div>

        <div class="table-container" id="table-container" style="display: none;">
            <table id="data-table">
                <thead id="table-head"></thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>

        <div class="paginator" id="paginator" style="display: none;">
            <button class="btn btn-outline btn-sm" id="prev-page-btn">← 前へ</button>
            <span class="page-info" id="page-info">1 / 1 ページ</span>
            <button class="btn btn-outline btn-sm" id="next-page-btn">次へ →</button>
            <span class="page-size-label">表示件数:</span>
            <select id="page-size-select" class="search-select" style="max-width: 130px;">
                <option value="200">200件 / ページ</option>
                <option value="100">100件 / ページ</option>
            </select>
        </div>
    </main>

    <!-- Loading Overlay -->
    <div id="loading-overlay">
        <div class="loading-spinner"></div>
        <span class="loading-text" id="loading-text">読み込み中...</span>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="content-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">内容</h2>
                <div style="display: flex; gap: 0.5rem; align-items: center;">
                    <button class="btn btn-outline btn-sm" id="modal-copy-btn">
                        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="margin-right: 2px;">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                        </svg>
                        コピー
                    </button>
                    <button class="modal-close" id="modal-close-btn">&times;</button>
                </div>
            </div>
            <div class="modal-body">
                <pre id="modal-text"></pre>
            </div>
        </div>
    </div>

    <script>
        // ============================================================
        // DOM Elements
        // ============================================================
        const dropZone        = document.getElementById('drop-zone');
        const fileInput       = document.getElementById('file-input');
        const fileInfo        = document.getElementById('file-info');
        const controls        = document.getElementById('controls');
        const tableContainer  = document.getElementById('table-container');
        const tableHead       = document.getElementById('table-head');
        const tableBody       = document.getElementById('table-body');
        const toggleColsBtn   = document.getElementById('toggle-cols-btn');
        const colSelectorPopup= document.getElementById('col-selector-popup');
        const searchInput     = document.getElementById('search-input');
        const searchBtn       = document.getElementById('search-btn');
        const searchColumnSelect = document.getElementById('search-column-select');
        const themeToggleBtn  = document.getElementById('theme-toggle');
        const modalCopyBtn    = document.getElementById('modal-copy-btn');
        const loadingOverlay  = document.getElementById('loading-overlay');
        const loadingText     = document.getElementById('loading-text');

        // ============================================================
        // Theme Toggle
        // ============================================================
        themeToggleBtn.addEventListener('click', () => {
            const isDark = document.body.getAttribute('data-theme') === 'dark';
            if (isDark) {
                document.body.removeAttribute('data-theme');
                themeToggleBtn.textContent = 'ダークモード';
            } else {
                document.body.setAttribute('data-theme', 'dark');
                themeToggleBtn.textContent = 'ライトモード';
            }
        });

        modalCopyBtn.addEventListener('click', () => {
            const textToCopy = document.getElementById('modal-text').textContent;
            copyToClipboard(textToCopy, modalCopyBtn);
        });

        // ============================================================
        // State
        // ============================================================
        let headers        = [];          // string[]          列名配列
        let allData        = [];          // string[][]         全行データ（不変）
        let searchIndex    = [];          // string[]           各行の検索用文字列（事前生成）
        let headerIndexMap = {};          // { colName: index } 列名→インデックス
        let filteredIndices = [];         // number[]           絞り込み後の行インデックス
        let columnVisibility = {};
        let currentSearchQuery = '';
        let searchColIndex = -1;          // -1 = 全列
        let activeDateFilter = null;
        let currentSort = { col: null, colIndex: -1, desc: false };
        let currentPage = 0;
        let PAGE_SIZE = 200;
        let currentTsvType = 'UNKNOWN';

        // ============================================================
        // Value Mapping
        // ============================================================
        const MAPS_ACME = {
            '申請種別': {
                '1': '1:ACME作成',
                '2': '2:ACME更新',
                '3': '3:ACME削除'
            },
            '状態': {
                '1': '1:ACME有効',
                '2': '2:ACME無効',
                '-1': '-1:フォーマットエラー',
                '-2': '-2:ACME連携処理エラー'
            },
            '証明書プロファイルID': {
                '3': '3:サーバ証明書（sha256WithRSAEncryption）',
                '11': '11:サーバ証明書（ecdsa-with-SHA384）'
            },
            '停止理由コード': {
                '0': '0:unspecified(未定義)',
                '1': '1:keyCompromise(秘密鍵の漏洩による証明書の脆弱化)',
                '3': '3:affiliationChanged(主体の所属変更)',
                '4': '4:superseded(証明書の更新)',
                '5': '5:cessationOfOperation(証明書の運用停止)'
            }
        };

        const MAPS_CERT = {
            '証明書プロファイルID': {
                '1': '1:サーバ証明書（sha1WithRSAEncryption）（有効期限：2016年12月31日まで）',
                '2': '2:サーバ証明書（sha1WithRSAEncryption）（有効期限：2015年12月31日まで）',
                '3': '3:サーバ証明書（sha256WithRSAEncryption）',
                '4': '4:クライアント証明書（sha1WithRSAEncryption）（有効期限：2016年12月31日まで）',
                '5': '5:クライアント証明書（sha256WithRSAEncryption）(証明書有効期間:52ヶ月)',
                '6': '6:S/MIME証明書（sha1WithRSAEncryption）（有効期限：2016年12月31日まで）',
                '7': '7:S/MIME証明書（sha256WithRSAEncryption）(2022年3月22日以降は証明書有効期間:823日。それ以前は証明書有効期間:52ヶ月)',
                '8': '8:コード署名用証明書（sha1WithRSAEncryption）（有効期限：2016年12月31日まで）',
                '9': '9:コード署名用証明書（sha256WithRSAEncryption）',
                '11': '11:サーバ証明書（ecdsa-with-SHA384）',
                '13': '13:クライアント証明書（sha256WithRSAEncryption）(証明書有効期間:13ヶ月)',
                '14': '14:クライアント証明書（sha256WithRSAEncryption）(証明書有効期間:25ヶ月)',
                '15': '15:S/MIME証明書（sha256WithRSAEncryption）(証明書有効期間:13ヶ月)',
                '16': '16:S/MIME証明書（sha256WithRSAEncryption）(証明書有効期間:25ヶ月)'
            },
            '状態': {
                '0': '0:証明書発行処理中',
                '1': '1:証明書更新処理中',
                '2': '2:証明書失効処理中',
                '3': '3:発行案内メール送信待ち',
                '4': '4:発行案内メール送信済み',
                '5': '5:証明書発行処理完了',
                '6': '6:証明書更新処理完了',
                '7': '7:証明書失効処理完了',
                '8': '8:新証明書への置き換え待ち',
                '9': '9:発行・更新完了メール送信待ち',
                '10': '10:失効完了メール送信待ち',
                '-1': '-1:フォーマットエラー',
                '-2': '-2:認証局連携API処理エラー',
                '-3': '-3:支援システム実行エラー'
            },
            '失効申請-失効理由コード': {
                '0': '0:unspecified(未定義)',
                '1': '1:keyCompromise(秘密鍵の漏洩)',
                '3': '3:affiliationChanged(利用管理者DNの変更)',
                '4': '4:superseded(証明書の更新)',
                '5': '5:cessationOfOperation(証明書の運用停止)'
            },
            'ダウンロード方法': {
                '1': '1:P12個別',
                '2': '2:P12一括',
                '3': '3:ブラウザ発行',
                '4': '4:CSR発行'
            }
        };

        // ============================================================
        // Web Worker Code（インラインBlobで単一HTMLを維持）
        // MAPS をJSONとして埋め込み、Worker内でパース＋インデックス構築を完結させる
        // ============================================================
        function createWorkerCode() {
            return `
const MAPS_ACME = ${JSON.stringify(MAPS_ACME)};
const MAPS_CERT = ${JSON.stringify(MAPS_CERT)};

function resolveMapping(header, value, tsvType) {
    const activeMap = tsvType === 'ACME' ? MAPS_ACME : (tsvType === 'CERT' ? MAPS_CERT : null);
    if (activeMap && activeMap[header] && activeMap[header][value]) {
        return activeMap[header][value];
    }
    return value;
}

self.onmessage = function(e) {
    const text = e.data;
    const lines = text.split(/\\r?\\n/);

    if (lines.length < 1) {
        self.postMessage({ headers: [], allData: [], searchIndex: [], tsvType: 'UNKNOWN' });
        return;
    }

    const headers = lines[0].split('\\t');
    const colCount = headers.length;

    // TSVタイプ判定
    let tsvType = 'UNKNOWN';
    if (colCount === 20)       tsvType = 'ACME';
    else if (colCount >= 46)   tsvType = 'CERT';

    const allData     = [];
    const searchIndex = [];

    for (let i = 1; i < lines.length; i++) {
        if (!lines[i].trim()) continue;
        const row = lines[i].split('\\t');
        allData.push(row);

        // 検索インデックスの構築（コードマッピング展開済み・小文字化）
        const parts = new Array(colCount);
        for (let j = 0; j < colCount; j++) {
            const val = row[j] || '';
            parts[j] = resolveMapping(headers[j], val, tsvType).toLowerCase();
        }
        searchIndex.push(parts.join('\\t'));
    }

    self.postMessage({ headers, allData, searchIndex, tsvType });
};
`;
        }

        // ============================================================
        // Drag & Drop / File Input
        // ============================================================
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.add('dragover'), false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, () => dropZone.classList.remove('dragover'), false);
        });

        dropZone.addEventListener('drop', (e) => processFiles(e.dataTransfer.files), false);
        fileInput.addEventListener('change', (e) => processFiles(e.target.files), false);

        function processFiles(files) {
            if (!files || files.length === 0) return;

            let tsvFiles = Array.from(files).filter(f => f.name.toLowerCase().endsWith('.tsv'));
            if (tsvFiles.length === 0) {
                alert('TSVファイルが見つかりません。拡張子が .tsv のファイルを選択してください。');
                return;
            }

            // 最新ファイルを選択
            tsvFiles.sort((a, b) => b.lastModified - a.lastModified);
            const newestFile = tsvFiles[0];

            showLoading(`読み込み中: ${newestFile.name}`);
            fileInfo.textContent = `読み込み中: ${newestFile.name}`;

            const reader = new FileReader();
            reader.onload = function(e) {
                startWorkerParse(e.target.result, newestFile.name);
            };
            reader.onerror = function() {
                hideLoading();
                alert('ファイルの読み込みに失敗しました。');
                fileInfo.textContent = 'エラー';
            };
            reader.readAsText(newestFile, 'Shift_JIS');
        }

        // ============================================================
        // Web Worker によるパース＋インデックス構築
        // ============================================================
        function startWorkerParse(text, filename) {
            showLoading('データを解析中...');

            const workerBlob = new Blob([createWorkerCode()], { type: 'application/javascript' });
            const workerUrl  = URL.createObjectURL(workerBlob);
            const worker     = new Worker(workerUrl);

            worker.onmessage = function({ data }) {
                URL.revokeObjectURL(workerUrl);
                worker.terminate();

                onParseComplete(data, filename);
            };

            worker.onerror = function(err) {
                URL.revokeObjectURL(workerUrl);
                hideLoading();
                alert('データ解析中にエラーが発生しました: ' + err.message);
                fileInfo.textContent = 'エラー';
            };

            worker.postMessage(text);
        }

        function onParseComplete({ headers: h, allData: d, searchIndex: si, tsvType: t }, filename) {
            // 状態を更新
            headers     = h;
            allData     = d;
            searchIndex = si;
            currentTsvType = t;

            // ヘッダインデックスマップを構築
            headerIndexMap = {};
            headers.forEach((col, i) => { headerIndexMap[col] = i; });

            // アプリタイトルを更新
            const titleEl = document.getElementById('app-title');
            if (currentTsvType === 'ACME') {
                titleEl.textContent = 'ACME情報ビューア';
            } else if (currentTsvType === 'CERT') {
                titleEl.textContent = 'サーバ証明書・クライアント証明書情報ビューア';
            } else {
                titleEl.textContent = `TSV ビューア (種別不明: ${headers.length}列)`;
            }

            // 列の表示状態を初期化
            columnVisibility = {};
            headers.forEach(col => {
                columnVisibility[col] = col !== '発行・更新申請-証明書';
            });

            // フィルタ・ソート・ページを初期化
            filteredIndices  = allData.map((_, i) => i);
            currentPage      = 0;
            currentSort      = { col: null, colIndex: -1, desc: false };
            currentSearchQuery = '';
            searchColIndex   = -1;
            activeDateFilter = null;
            searchInput.value = '';
            searchColumnSelect.value = 'all';
            document.querySelectorAll('.date-filter-btn').forEach(btn => btn.classList.remove('active-filter'));

            fileInfo.textContent = `読み込み完了: ${filename} (${allData.length.toLocaleString()} 件)`;
            dropZone.classList.add('compact');
            controls.style.display = 'flex';
            document.getElementById('quick-filters').style.display = 'flex';
            document.getElementById('record-count').style.display = 'inline-block';
            tableContainer.style.display = 'block';

            renderColSelector();
            updateSearchColumnOptions();
            renderTableHeader();
            renderPage();
            hideLoading();
        }

        // ============================================================
        // Loading UI
        // ============================================================
        function showLoading(msg) {
            loadingText.textContent = msg || '読み込み中...';
            loadingOverlay.classList.add('show');
        }

        function hideLoading() {
            loadingOverlay.classList.remove('show');
        }

        // ============================================================
        // Filtering（データ層のみ操作、DOM操作なし）
        // ============================================================
        function applyFilter() {
            const query = currentSearchQuery;
            filteredIndices = [];

            const total = allData.length;
            for (let i = 0; i < total; i++) {
                // テキスト検索（事前インデックスを使用）
                let matchText = true;
                if (query) {
                    if (searchColIndex === -1) {
                        matchText = searchIndex[i].includes(query);
                    } else {
                        matchText = (allData[i][searchColIndex] || '').toLowerCase().includes(query);
                    }
                }

                // 日付フィルタ
                let matchDate = true;
                if (activeDateFilter) {
                    const dateStr = allData[i][activeDateFilter.colIndex] || '';
                    matchDate = checkDateFilter(dateStr, activeDateFilter);
                }

                if (matchText && matchDate) filteredIndices.push(i);
            }

            // アクティブなソートがあれば適用
            if (currentSort.col !== null && currentSort.colIndex >= 0) {
                sortFilteredIndices();
            }

            currentPage = 0;
            renderPage();
            updateRecordCount();
        }

        function checkDateFilter(dateStr, filter) {
            if (!dateStr || dateStr.trim() === '') return false;
            const d = new Date(dateStr.replace(/-/g, '/').split('.')[0]);
            if (isNaN(d.getTime())) return false;
            const today = new Date();
            today.setHours(0, 0, 0, 0);
            const diffDays = (d.getTime() - today.getTime()) / (1000 * 60 * 60 * 24);
            if (filter.type === 'past') {
                return diffDays <= 1 && diffDays >= -filter.days;
            } else {
                return diffDays >= -1 && diffDays <= filter.days;
            }
        }

        // ============================================================
        // Sorting（filteredIndices の並び替えのみ。allData は不変）
        // ============================================================
        function sortFilteredIndices() {
            const ci = currentSort.colIndex;
            const desc = currentSort.desc;
            filteredIndices.sort((a, b) => sortCompare(
                allData[a][ci] || '',
                allData[b][ci] || '',
                desc
            ));
        }

        function sortCompare(va, vb, desc) {
            const dateA = new Date(va.replace(/-/g, '/').split('.')[0]);
            const dateB = new Date(vb.replace(/-/g, '/').split('.')[0]);
            if (!isNaN(dateA.getTime()) && !isNaN(dateB.getTime())) {
                return desc ? dateB - dateA : dateA - dateB;
            }
            const numA = parseFloat(va);
            const numB = parseFloat(vb);
            if (!isNaN(numA) && !isNaN(numB)) {
                return desc ? numB - numA : numA - numB;
            }
            return desc ? vb.localeCompare(va) : va.localeCompare(vb);
        }

        function handleSort(header) {
            const colIndex = headerIndexMap[header] ?? -1;
            if (currentSort.col === header) {
                currentSort.desc = !currentSort.desc;
            } else {
                currentSort.col = header;
                currentSort.colIndex = colIndex;
                currentSort.desc = false;
            }
            sortFilteredIndices();
            currentPage = 0;
            renderPage();
        }

        // ============================================================
        // Rendering
        // ============================================================
        function renderTableHeader() {
            tableHead.innerHTML = '';
            const trHead = document.createElement('tr');
            headers.forEach(header => {
                const th = document.createElement('th');
                th.style.cursor = 'pointer';
                let indicator = ' ↕';
                if (currentSort.col === header) {
                    indicator = currentSort.desc ? ' ⬇' : ' ⬆';
                    th.classList.add('sorted-col');
                }
                th.textContent = header + indicator;
                th.dataset.col = header;
                if (!columnVisibility[header]) th.classList.add('hidden-col');
                th.addEventListener('click', () => handleSort(header));
                trHead.appendChild(th);
            });
            tableHead.appendChild(trHead);
        }

        function renderPage() {
            renderTableHeader();
            tableBody.innerHTML = '';

            if (filteredIndices.length === 0) {
                const tr = document.createElement('tr');
                const td = document.createElement('td');
                td.colSpan = headers.length;
                td.className = 'empty-state';
                td.textContent = allData.length === 0
                    ? 'データがありません'
                    : '検索条件に一致するデータがありません';
                tr.appendChild(td);
                tableBody.appendChild(tr);
                renderPaginator();
                updateRecordCount();
                return;
            }

            const start = currentPage * PAGE_SIZE;
            const end   = Math.min(start + PAGE_SIZE, filteredIndices.length);
            const fragment = document.createDocumentFragment();

            for (let pi = start; pi < end; pi++) {
                const rowIdx = filteredIndices[pi];
                const rowArr = allData[rowIdx];
                const tr = document.createElement('tr');
                tr.id = `row-${rowIdx}`;

                headers.forEach((header, hi) => {
                    const td = document.createElement('td');
                    td.dataset.col = header;
                    td.innerHTML = formatCellDisplay(header, rowArr[hi] || '', rowArr);
                    if (!columnVisibility[header]) td.classList.add('hidden-col');
                    tr.appendChild(td);
                });

                fragment.appendChild(tr);
            }

            tableBody.appendChild(fragment);
            renderPaginator();
            updateRecordCount();
            tableContainer.scrollTop = 0;
        }

        function renderPaginator() {
            const paginator = document.getElementById('paginator');
            const totalPages = Math.ceil(filteredIndices.length / PAGE_SIZE);

            if (totalPages <= 1) {
                paginator.style.display = 'none';
                return;
            }

            paginator.style.display = 'flex';
            document.getElementById('prev-page-btn').disabled = currentPage === 0;
            document.getElementById('next-page-btn').disabled = currentPage >= totalPages - 1;
            document.getElementById('page-info').textContent =
                `${(currentPage + 1).toLocaleString()} / ${totalPages.toLocaleString()} ページ`;
        }

        function updateRecordCount() {
            const el = document.getElementById('record-count');
            if (el) {
                el.textContent = `表示中: ${filteredIndices.length.toLocaleString()} 件 / 全 ${allData.length.toLocaleString()} 件`;
            }
        }

        // ============================================================
        // Search Events
        // ============================================================
        searchBtn.addEventListener('click', handleSearch);
        searchInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') handleSearch();
        });
        searchColumnSelect.addEventListener('change', handleSearch);

        function handleSearch() {
            currentSearchQuery = searchInput.value.toLowerCase().trim();
            const selVal = searchColumnSelect.value;
            searchColIndex = selVal === 'all' ? -1 : (headerIndexMap[selVal] ?? -1);
            applyFilter();
        }

        // ============================================================
        // Paginator Events
        // ============================================================
        document.getElementById('prev-page-btn').addEventListener('click', () => {
            if (currentPage > 0) {
                currentPage--;
                renderPage();
            }
        });

        document.getElementById('next-page-btn').addEventListener('click', () => {
            const totalPages = Math.ceil(filteredIndices.length / PAGE_SIZE);
            if (currentPage < totalPages - 1) {
                currentPage++;
                renderPage();
            }
        });

        document.getElementById('page-size-select').addEventListener('change', (e) => {
            PAGE_SIZE = parseInt(e.target.value, 10);
            currentPage = 0;
            renderPage();
        });

        // ============================================================
        // Column Visibility
        // ============================================================
        toggleColsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            colSelectorPopup.classList.toggle('show');
        });

        document.addEventListener('click', (e) => {
            if (!colSelectorPopup.contains(e.target) && e.target !== toggleColsBtn) {
                colSelectorPopup.classList.remove('show');
            }
        });

        function renderColSelector() {
            colSelectorPopup.innerHTML = '';
            headers.forEach(header => {
                const label = document.createElement('label');
                label.className = 'col-option';

                const cb = document.createElement('input');
                cb.type = 'checkbox';
                cb.checked = columnVisibility[header];
                cb.dataset.col = header;

                cb.addEventListener('change', (e) => {
                    columnVisibility[header] = e.target.checked;
                    updateTableVisibility();
                });

                label.appendChild(cb);
                label.appendChild(document.createTextNode(header));
                colSelectorPopup.appendChild(label);
            });
        }

        function updateSearchColumnOptions() {
            searchColumnSelect.innerHTML = '<option value="all">すべての列</option>';
            headers.forEach(header => {
                const opt = document.createElement('option');
                opt.value = header;
                opt.textContent = header;
                searchColumnSelect.appendChild(opt);
            });
        }

        function updateTableVisibility() {
            tableHead.querySelectorAll('th').forEach(th => {
                th.classList.toggle('hidden-col', !columnVisibility[th.dataset.col]);
            });
            tableBody.querySelectorAll('td[data-col]').forEach(td => {
                td.classList.toggle('hidden-col', !columnVisibility[td.dataset.col]);
            });
        }

        // ============================================================
        // Date Filter / Reset
        // ============================================================
        function setDateFilter(col, type, days, btnElement) {
            document.querySelectorAll('.date-filter-btn').forEach(btn => btn.classList.remove('active-filter'));

            if (activeDateFilter && activeDateFilter.col === col && activeDateFilter.days === days) {
                activeDateFilter = null;
            } else {
                const colIndex = headerIndexMap[col] ?? -1;
                activeDateFilter = { col, colIndex, type, days };
                btnElement.classList.add('active-filter');
            }
            applyFilter();
        }

        function resetFilters() {
            searchInput.value      = '';
            currentSearchQuery     = '';
            searchColumnSelect.value = 'all';
            searchColIndex         = -1;
            activeDateFilter       = null;
            currentSort            = { col: null, colIndex: -1, desc: false };
            document.querySelectorAll('.date-filter-btn').forEach(btn => btn.classList.remove('active-filter'));
            filteredIndices = allData.map((_, i) => i);
            currentPage = 0;
            renderPage();
            updateRecordCount();
        }

        // ============================================================
        // Export（filteredIndices の順序・内容をエクスポート）
        // ============================================================
        function exportData() {
            if (filteredIndices.length === 0) {
                alert('エクスポートするデータがありません。');
                return;
            }

            let tsvContent = '\uFEFF' + headers.join('\t') + '\n';
            filteredIndices.forEach(idx => {
                tsvContent += allData[idx].join('\t') + '\n';
            });

            const blob = new Blob([tsvContent], { type: 'text/tab-separated-values;charset=utf-8;' });
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href     = url;
            a.download = 'export.tsv';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // ============================================================
        // Modal Events
        // ============================================================
        document.getElementById('modal-close-btn').addEventListener('click', () => {
            document.getElementById('content-modal').classList.remove('show');
        });
        document.getElementById('content-modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('content-modal')) {
                document.getElementById('content-modal').classList.remove('show');
            }
        });

        // ============================================================
        // Cell Display Utilities
        // ============================================================
        function processCellValue(header, value) {
            const activeMap = currentTsvType === 'ACME' ? MAPS_ACME : (currentTsvType === 'CERT' ? MAPS_CERT : null);
            if (activeMap && activeMap[header] && activeMap[header][value]) {
                return activeMap[header][value];
            }
            return value;
        }

        function encodeBase64(str) {
            return btoa(unescape(encodeURIComponent(str)));
        }

        function decodeBase64(b64) {
            return decodeURIComponent(escape(atob(b64)));
        }

        function formatAsPEM(data, headerText, footerText) {
            const cleanContent = data.replace(/\s+/g, '');
            let pemChunks = [];
            for (let i = 0; i < cleanContent.length; i += 64) {
                pemChunks.push(cleanContent.substring(i, i + 64));
            }
            return `${headerText}\n${pemChunks.join('\n')}\n${footerText}\n`;
        }

        function triggerDownload(content, filename) {
            const blob = new Blob([content], { type: 'text/plain;charset=utf-8;' });
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href     = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function downloadCert(element, type) {
            const b64Content  = element.getAttribute('data-content');
            const rawContent  = decodeBase64(b64Content);
            const baseFilename = element.getAttribute('data-filename') || 'download';

            let pemContent = '';
            let filename   = '';

            if (type === 'CSR') {
                pemContent = formatAsPEM(rawContent, '-----BEGIN NEW CERTIFICATE REQUEST-----', '-----END NEW CERTIFICATE REQUEST-----');
                filename   = `${baseFilename}.csr`;
            } else if (type === '発行・更新申請-証明書') {
                pemContent = formatAsPEM(rawContent, '-----BEGIN CERTIFICATE-----', '-----END CERTIFICATE-----');
                filename   = `${baseFilename}.cer`;
            }

            triggerDownload(pemContent, filename);
        }

        function openModal(title, element) {
            const b64Content = element.getAttribute('data-content');
            document.getElementById('modal-title').textContent = title;
            document.getElementById('modal-text').textContent  = decodeBase64(b64Content);
            document.getElementById('content-modal').classList.add('show');
        }

        function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function getStatusBadgeClass(header, value) {
            const valStr = String(value).trim();
            if (header === '状態') {
                if (currentTsvType === 'ACME') {
                    if (valStr === '1')  return 'status-success';
                    if (valStr === '2')  return 'status-warning';
                    return 'status-danger';
                } else if (currentTsvType === 'CERT') {
                    if (['5','6','7'].includes(valStr))         return 'status-success';
                    if (['-1','-2','-3'].includes(valStr))      return 'status-danger';
                    if (['0','1','2','8','9','10'].includes(valStr)) return 'status-info';
                    return 'status-warning';
                }
            }
            if (header === '申請種別') {
                if (valStr === '1') return 'status-info';
                if (valStr === '2') return 'status-success';
                if (valStr === '3') return 'status-danger';
            }
            if (header === 'ダウンロード方法')    return 'status-info';
            if (header === '停止理由コード') {
                if (valStr === '0') return 'status-info';
                return 'status-warning';
            }
            if (header === '失効申請-失効理由コード') {
                if (valStr === '1') return 'status-danger';
                return 'status-info';
            }
            return '';
        }

        function copyToClipboard(text, buttonElement) {
            navigator.clipboard.writeText(text).then(() => {
                if (buttonElement) {
                    const originalText = buttonElement.innerHTML;
                    buttonElement.classList.add('copied');
                    buttonElement.innerHTML = `
                        <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="margin-right: 2px;">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                        </svg>
                        コピーしました！
                    `;
                    setTimeout(() => {
                        buttonElement.classList.remove('copied');
                        buttonElement.innerHTML = originalText;
                    }, 2000);
                }
            }).catch(err => {
                console.error('コピーに失敗しました: ', err);
                alert('コピーに失敗しました。');
            });
        }

        function copyCellText(element) {
            const b64Content = element.getAttribute('data-content');
            const rawContent = decodeBase64(b64Content);
            navigator.clipboard.writeText(rawContent).then(() => {
                const originalSvg = element.innerHTML;
                element.innerHTML = `
                    <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                `;
                element.style.color = '#22c55e';
                setTimeout(() => {
                    element.innerHTML = originalSvg;
                    element.style.color = '';
                }, 1500);
            }).catch(err => console.error('コピー失敗: ', err));
        }

        /**
         * セルの表示HTMLを生成する
         * @param {string} header  列名
         * @param {string} value   セルの生値
         * @param {string[]} rowArr  行データ配列（headerIndexMap 経由でアクセス）
         */
        function formatCellDisplay(header, value, rowArr) {
            let processed = processCellValue(header, value);

            // 大容量コンテンツ列（CSR / 証明書）
            if ((header === 'CSR' || header === '発行・更新申請-証明書') && processed.trim() !== '') {
                const b64 = encodeBase64(processed);

                let baseFilename = 'download';
                const dnsIdx  = headerIndexMap['dNSName'];
                const dnIdx   = headerIndexMap['利用管理者DN'];
                const snIdx   = headerIndexMap['証明書シリアル番号'];

                if (dnsIdx !== undefined && rowArr[dnsIdx]) {
                    let firstDns = rowArr[dnsIdx].split(',')[0];
                    firstDns = firstDns.replace(/^dNSName[=_]/, '');
                    baseFilename = firstDns.replace(/[^a-zA-Z0-9.-]/g, '_');
                } else if (dnIdx !== undefined && rowArr[dnIdx]) {
                    const cnMatch = rowArr[dnIdx].match(/CN=([^,]+)/);
                    if (cnMatch) baseFilename = cnMatch[1].replace(/[^a-zA-Z0-9.-]/g, '_');
                } else if (snIdx !== undefined && rowArr[snIdx]) {
                    baseFilename = rowArr[snIdx].replace(/[^a-zA-Z0-9]/g, '');
                }

                return `
                    <div style="display: flex; gap: 0.5rem; flex-wrap: wrap;">
                        <button class="btn btn-outline btn-sm" onclick="openModal('${header}', this)" data-content="${b64}">内容を表示</button>
                        <button class="btn btn-sm" onclick="downloadCert(this, '${header}')" data-content="${b64}" data-filename="${baseFilename}">
                            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
                            </svg>ダウンロード
                        </button>
                    </div>
                `;
            }

            // ステータスバッジ列
            const badgeClass = getStatusBadgeClass(header, value);
            if (badgeClass) {
                return `<span class="status-badge ${badgeClass}">${processed}</span>`;
            }

            // コピー可能テキスト列
            const copyableHeaders = [
                'dNSName', '利用管理者DN', '利用管理者DN(再入力)', '証明書DN',
                '証明書シリアル番号', 'ACMEID', 'ACMEのディレクトリURL',
                '発行・更新申請-シリアル番号', '利用管理者FQDN', '主体者DN', '発行・更新申請-申請ID'
            ];
            if (copyableHeaders.includes(header) && processed.trim() !== '') {
                const b64 = encodeBase64(processed);
                const displayVal = header === 'dNSName'
                    ? processed.replace(/,/g, '<br>')
                    : escapeHtml(processed);
                return `
                    <div class="copyable-cell">
                        <span>${displayVal}</span>
                        <button class="copy-cell-btn" onclick="copyCellText(this)" data-content="${b64}" title="クリップボードにコピー">
                            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path>
                            </svg>
                        </button>
                    </div>
                `;
            }

            if (header === 'dNSName') {
                return processed.replace(/,/g, '<br>');
            }

            return escapeHtml(processed);
        }

        // ============================================================
        // Utilities
        // ============================================================
        function formatDate(timestamp) {
            const d = new Date(timestamp);
            return `${d.getFullYear()}/${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
        }
    </script>
</body>
